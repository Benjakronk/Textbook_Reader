<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Markdown Reader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c222c"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cbcff"/>
      <stop offset="100%" stop-color="#5aa9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)" stroke="#262d39" stroke-width="2"/>

  <g fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="56,176 56,84 96,128 136,84 136,176"/>
  </g>

  <g fill="url(#accent)" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill-rule="evenodd">
    <line x1="184" y1="84"  x2="184" y2="160"/>
    <polyline points="160,140 184,176 208,140" fill="none"/>
  </g>

  <circle cx="208" cy="56" r="10" fill="#5aa9ff" filter="url(#glow)"/>
</svg>
